# GitHub Actions CI — Cross-Platform C++23 Build
name: 🏗️ Build

on:
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      # Cache fetched dependencies
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

      # ccache database
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Linux
      # ------------------------------------------------------------

      - name: 🐧 Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-14 \
            g++-14 \
            ccache \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libopenal-dev \
            libflac-dev \
            libvorbis-dev \
            libpthread-stubs0-dev \
            libmbedtls-dev \
            libssh2-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            xvfb

      # ------------------------------------------------------------
      # macOS
      # ------------------------------------------------------------

      - name: 🍎 Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openal-soft ccache

      # ------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------

      - name: 🪟 Install MSYS2 UCRT64 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache

      # ------------------------------------------------------------
      # ccache
      # ------------------------------------------------------------

      - name: 🔍 Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache

          # Stable key intentionally used.
          # ccache itself determines whether individual
          # compilations are reusable.
          key: ccache-${{ matrix.os }}-v1

      - name: 🧰 Configure ccache
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          ccache --set-config max_size=1.0G
          ccache --set-config compression=true
          ccache --zero-stats

      # ------------------------------------------------------------
      # FetchContent
      # ------------------------------------------------------------

      - name: 📦 Restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent

          key: fetch-${{ matrix.os }}-${{ hashFiles('dependencies.cmake', '**/CMakeLists.txt') }}

          restore-keys: |
            fetch-${{ matrix.os }}-

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: 🔧 Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 🔧 Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 🔧 Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: ⚙️ Build
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          cmake --build build --config Release --parallel 4

      # ------------------------------------------------------------
      # Package Windows runtime
      # ------------------------------------------------------------

      - name: 📦 Package Windows runtime
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/bin/Game2.exe package/

          # Copy every non-system DLL resolved by Game2.exe.
          # This includes the exact UCRT64 libstdc++/libgcc runtime
          # and any SFML/runtime DLLs required by the executable.
          ldd build/bin/Game2.exe \
            | sed -n 's/.*=> \([^ ]*\.dll\) (.*/\1/p' \
            | while read -r dll; do
                case "$dll" in
                  /ucrt64/bin/*.dll|/c/*/build/bin/*.dll)
                    cp -n "$dll" package/ || true
                    ;;
                esac
              done

          cp -r build/bin/assets package/
          cp -r build/bin/data package/

          7z a Game2-Windows.zip package/*

      - name: 📤 Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Game2-Windows
          path: Game2-Windows.zip
          if-no-files-found: error

      # ------------------------------------------------------------
      # ccache statistics
      # ------------------------------------------------------------

      - name: 📊 ccache stats
        if: always()
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          ccache --show-stats || true

  # ------------------------------------------------------------
  # Formatting
  # ------------------------------------------------------------

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧹 Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: 🎨 clang-format check
        shell: bash
        run: |
          files=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' \))

          if [ -n "$files" ]; then
            if ! clang-format-18 --dry-run --Werror $files; then
              echo "::warning::clang-format found formatting issues. Run clang-format to fix them."
            fi
          fi
