name: 🏗️ Build

on:
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # Cache fetched dependencies (SFML, GLM, EnTT, nlohmann/json)
      # so FetchContent doesn't re-download on every run.
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.cache/fetchcontent

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐧 Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libudev-dev libopenal-dev \
            libflac-dev libvorbis-dev libpthread-stubs0-dev ccache \
            libmbedtls-dev libssh2-1-dev libfreetype6-dev libharfbuzz-dev xvfb

      - name: 🍎 Install macOS deps
        if: runner.os == 'macOS'
        run: brew install openal-soft ccache

      - name: 🪟 Install Windows deps
        if: runner.os == 'Windows'
        run: choco install ccache --yes

      - name: 🔍 Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ccache
          # Cache key tied to OS + compiler + branch; falls back to main.
          key: ccache-${{ matrix.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ github.ref_name }}-
            ccache-${{ matrix.os }}-main-

      - name: 📦 Restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetch-${{ matrix.os }}-${{ hashFiles('dependencies.cmake') }}
          restore-keys: |
            fetch-${{ matrix.os }}-

      - name: 🧰 Configure ccache
        run: |
          ccache --set-config max_size=1.0G
          ccache --set-config compression=true
          ccache --zero-stats || true

      - name: 🔧 Configure
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux|macOS) export CCACHE_DIR="${{ github.workspace }}/.cache/ccache" ;;
          esac
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: ⚙️ Build
        run: cmake --build build --config Release -j 4

      - name: 📊 ccache stats
        if: always()
        run: ccache --show-stats || true
